/**:
  ros__parameters:
    # ARX feedback / command topics (from single_arm.yaml defaults)
    status_topic: arm_status
    cmd_topic: arm_cmd
    # POSITION_CONTROL enum value in InterfacesThread::state
    position_mode: 5
    # Publish joint1..joint6; gripper joint_pos[6] is not dual prismatic mapping
    publish_gripper_as_joint7_joint8: false
    # Control rate for trajectory streaming to ARX (Hz)
    # ARX normal PubState is 10ms (100Hz); stream commands at 100Hz
    command_rate_hz: 50.0
    # Goal tolerance (rad) after trajectory time completes
    goal_tolerance_rad: 0.08
    goal_settle_time_s: 1.0
    # Software joint limits (arx5-sdk X5) — NOT VALIDATED FOR FULL HARDWARE RANGE
    joint_names: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6"]
    joint_pos_min: [-3.14, -0.05, -0.1, -1.6, -1.57, -2.0]
    joint_pos_max: [2.618, 3.50, 3.20, 1.55, 1.57, 2.0]
    # Action names
    arm_action_name: /x5a_arm_controller/follow_joint_trajectory
    # Hold last command on cancel
    hold_on_cancel: true

    gripper_open_command: 5.0
    gripper_close_command: 0.0
    gripper_settle_time_s: 0.8
    gripper_hold_rate_hz: 50.0
