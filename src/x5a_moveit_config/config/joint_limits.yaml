# NOT VALIDATED FOR HARDWARE
# Arm position limits source: arx5-sdk include/app/config.h RobotConfigFactory["X5"]
# (software controller limits for model "X5", not a measured X5A mechanical datasheet)
# Gripper prismatic limits source: ARX_Model X5A.urdf joint7/joint8
# URDF SolidWorks limits of ±10 rad are intentionally NOT used for planning.
joint_limits:
  joint1:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
    has_position_limits: true
    min_position: -3.14
    max_position: 2.618
  joint2:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
    has_position_limits: true
    min_position: -0.05
    max_position: 3.50
  joint3:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
    has_position_limits: true
    min_position: -0.1
    max_position: 3.20
  joint4:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 2.5
    has_position_limits: true
    # X5A hardware commissioning: joint4 stopped near -1.2915 rad while the
    # older X5 software limit allowed unreachable trajectories below it.
    # 2026-08-13 C-execution confirmed the active stop at -1.2911 rad (goal
    # -1.3450 never reached), so this value matches the ACTIVE hardware
    # range; the passive hand-sweep (-1.647 rad, gravity mode) does not
    # apply to servo-controlled motion. Keep -1.28.
    min_position: -1.28
    max_position: 1.55
  joint5:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 2.5
    has_position_limits: true
    min_position: -1.57
    max_position: 1.57
  joint6:
    has_velocity_limits: true
    max_velocity: 1.2
    has_acceleration_limits: true
    max_acceleration: 2.5
    has_position_limits: true
    min_position: -2.0
    max_position: 2.0
  joint7:
    has_velocity_limits: true
    max_velocity: 0.05
    has_acceleration_limits: true
    max_acceleration: 0.1
    has_position_limits: true
    min_position: 0.0
    max_position: 0.044
  joint8:
    has_velocity_limits: true
    max_velocity: 0.05
    has_acceleration_limits: true
    max_acceleration: 0.1
    has_position_limits: true
    min_position: 0.0
    max_position: 0.044
