# Real robot controller mapping for X5A.
# NOT VALIDATED FOR FULL HARDWARE RANGE.
# Fake/mock controllers are not used by x5a_real_moveit.launch.py.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - x5a_arm_controller
    - x5a_gripper_controller

  # The official adapter accepts one finger position in meters. joint7 and
  # joint8 mirror the same measured position, so command only joint7; enabling
  # the parallel-jaw sum would incorrectly send twice the verified opening.
  command_joint: joint7
  parallel: false

  x5a_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

  x5a_gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    default: true
    joints:
      - joint7
      - joint8
